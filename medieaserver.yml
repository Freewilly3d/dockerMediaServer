services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: container:gluetun
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    volumes:
      - $DOCKERDIR/sabnzbd/config:/config
      - $PATHDOWN:/downloads
    restart: unless-stopped
#  transmission:
#    image: lscr.io/linuxserver/transmission:latest
